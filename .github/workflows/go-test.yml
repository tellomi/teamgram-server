# Runs the module tests on every pull request. Packages under e2e/client are a
# separate module and run in the Client regression workflow, against compose.

name: Go test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ip2region xdb
        uses: ./.github/actions/ip2region-xdb
        with:
          dest: data/ip2region

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install libvips
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc pkg-config libvips-dev

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: MySQL 8.0.13 migrations and JSON equivalence
        run: TEAMGRAM_MYSQL_COMPAT=1 go test ./teamgramd/deploy/sqlmigrate/ -count=1 -timeout 25m -run 'TestMySQLCompat'

      - name: Langpack host rewrite
        working-directory: scripts
        run: |
          python3 -m pip install --disable-pip-version-check -q opencc-python-reimplemented
          python3 -m unittest langpack_official_test langpack_fill_test langpack_zh_test
