# Client regression. Runs on every pull request. Branch protection must
# require the check "Client regression / e2e" so a red run blocks merge.
# See docs/e2e.md.

name: Client regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Passed into the teamgram container by docker-compose.yaml.
      # TestHelpGetConfig requires TELLOMI_E2E_DC_OPTIONS to match.
      # 127.0.0.1 is this job only. Production .env stays empty.
      TELLOMI_DC_OPTIONS: 1:127.0.0.1:10443,1:127.0.0.1:5222
      TELLOMI_E2E_DC_OPTIONS: 1:127.0.0.1:10443,1:127.0.0.1:5222
      # Isolated enforcement listener inside the CI container. The value is
      # 32 bytes of the letter E, standard base64. It is not a production key.
      TELLOMI_ENFORCEMENT_E2E: "1"
      TELLOMI_ENFORCEMENT_SERVICE_KEY: RUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUU=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ip2region xdb
        uses: ./.github/actions/ip2region-xdb
        with:
          dest: deploy/ip2region/cache

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Start MySQL and migrate the isolated enforcement database
        env:
          TELLOMI_ENFORCEMENT_MYSQL: root:root@tcp(127.0.0.1:3306)/tellomi_enforcement_e2e?parseTime=true&charset=utf8mb4
        run: |
          docker compose \
            -f docker-compose-env.yaml \
            -f docker-compose.yaml \
            -f e2e/docker-compose.ci.yaml \
            up -d mysql
          for i in $(seq 1 60); do
            if docker compose \
              -f docker-compose-env.yaml \
              -f docker-compose.yaml \
              -f e2e/docker-compose.ci.yaml \
              exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -proot >/dev/null 2>&1; then
              go run ./e2e/enforcementmigrate
              exit 0
            fi
            sleep 2
          done
          echo "mysql did not accept connections"
          exit 1

      - name: Start the compose stack
        run: |
          # e2e/docker-compose.ci.yaml only swaps the object-storage image
          # and skips monitoring. See that file.
          docker compose \
            -f docker-compose-env.yaml \
            -f docker-compose.yaml \
            -f e2e/docker-compose.ci.yaml \
            up -d --build
          echo "waiting for MTProto on 10443"
          # Probe inside the container. A host /dev/tcp check succeeds as soon
          # as Docker publishes the port, before gnetway is listening.
          for i in $(seq 1 120); do
            if docker compose \
              -f docker-compose-env.yaml \
              -f docker-compose.yaml \
              -f e2e/docker-compose.ci.yaml \
              exec -T teamgram bash -c 'echo >/dev/tcp/127.0.0.1/10443' >/dev/null 2>&1; then
              echo "gnetway is accepting connections"
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose-env.yaml -f docker-compose.yaml -f e2e/docker-compose.ci.yaml ps
          docker compose -f docker-compose-env.yaml -f docker-compose.yaml -f e2e/docker-compose.ci.yaml logs --tail=200 teamgram || true
          echo "teamgram did not open 10443"
          exit 1

      - name: Client regression
        env:
          TELLOMI_E2E: "1"
          TELLOMI_E2E_ADDR: 127.0.0.1:10443
          TELLOMI_E2E_RESTART: "1"
          TELLOMI_E2E_LOCAL_RESET: "1"
          TELLOMI_E2E_ROOT: ${{ github.workspace }}
          TELLOMI_E2E_COMPOSE_FILES: docker-compose-env.yaml,docker-compose.yaml,e2e/docker-compose.ci.yaml
        run: |
          cd e2e/client
          go test -count=1 -timeout 40m -v .

      - name: Stack logs
        if: failure()
        run: |
          docker compose -f docker-compose-env.yaml -f docker-compose.yaml -f e2e/docker-compose.ci.yaml ps
          docker compose -f docker-compose-env.yaml -f docker-compose.yaml -f e2e/docker-compose.ci.yaml logs --tail=300 teamgram || true
