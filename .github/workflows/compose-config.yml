# Fails when a default `docker compose -f docker-compose-env.yaml config`
# includes minio or minio-mc. Those services stay on profile local-minio so
# production `up` does not pull them.

name: Compose config

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  minio-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Default env compose excludes minio
        run: bash scripts/check-compose-minio-profile.sh

      - name: Teamgram image binaries are derived from the entrypoint
        run: bash scripts/verify-teamgram-binaries.sh --self-test

      - name: shellcheck deploy and ops scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -x deploy-pull.sh scripts/ops/*.sh
          bash scripts/ops/tellomi-image-cleanup.sh --self-test
          bash scripts/ops/tellomi-db-backup.sh --self-test
