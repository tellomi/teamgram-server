# Copies third-party images listed in .github/mirror-images.txt from Docker Hub
# into ACR. The server pulls those copies; it does not use DaoCloud.

name: Mirror images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/mirror-images.txt

permissions:
  contents: read

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY || 'crpi-tge4xmtf4iip17mq.cn-chengdu.personal.cr.aliyuncs.com' }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE || 'tellomi' }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Install crane
        run: |
          set -euo pipefail
          version=v0.22.1
          curl -fsSL -o crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${version}/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf crane.tar.gz crane
          sudo install -m 755 crane /usr/local/bin/crane
          crane version

      - name: Copy images
        run: |
          set -euo pipefail
          copied=0
          while IFS= read -r line || [[ -n "${line}" ]]; do
            case "${line}" in
              ''|\#*) continue ;;
            esac
            line="${line%%#*}"
            read -r src dest extra <<< "${line}"
            if [[ -z "${src}" || -z "${dest}" || -n "${extra:-}" ]]; then
              echo "expected '<source> <repository>': ${line}" >&2
              exit 1
            fi
            tag="${src##*:}"
            if [[ "${tag}" == "${src}" || -z "${tag}" ]]; then
              echo "source needs a tag: ${src}" >&2
              exit 1
            fi
            target="${ACR_REGISTRY}/${ACR_NAMESPACE}/${dest}:${tag}"
            echo "copy ${src} -> ${target}"
            crane copy "${src}" "${target}"
            copied=$((copied + 1))
          done < .github/mirror-images.txt
          if [[ "${copied}" -eq 0 ]]; then
            echo "no images listed in .github/mirror-images.txt" >&2
            exit 1
          fi
