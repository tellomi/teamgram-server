Name: interface.session
ListenOn: 127.0.0.1:20120
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: interface.session
Cache:
  - Host: 127.0.0.1:6379
AuthSession:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.authsession
StatusClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.status
GatewayClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.gateway

BFFProxyClients:
  Clients:
    - Etcd:
        Hosts:
          - 127.0.0.1:2379
        Key: bff.bff
    - Etcd:
        Hosts:
          - 127.0.0.1:2379
        Key: messenger.biz_server.phone
  IDMap:
    "/mtproto.RPCTos": "bff.bff"
    #"/mtproto.RPCReports": "bff.bff"
    "/mtproto.RPCConfiguration": "bff.bff"
    "/mtproto.RPCQrCode": "bff.bff"
    "/mtproto.RPCMiscellaneous": "bff.bff"
    "/mtproto.RPCAuthorization": "bff.bff"
    # auth.finishPasskeyLogin. Passkeys are not issued; the method returns PASSKEY_CREDENTIAL_NOT_FOUND.
    "/mtproto.RPCPasskey": "bff.bff"
    #"/mtproto.RPCGdpr": "bff.bff"
    # Saved GIFs: messages.getSavedGifs and messages.saveGif.
    "/mtproto.RPCGifs": "bff.bff"
    # help.getPromoData and help.hidePromoData.
    "/mtproto.RPCPromoData": "bff.bff"
    # Support notes: help.getUserInfo and help.editUserInfo.
    "/mtproto.RPCTsf": "bff.bff"
    # help.getTimezonesList.
    "/mtproto.RPCTimezones": "bff.bff"
    # Cloud password: account.getPassword and the other RPCTwoFa methods.
    "/mtproto.RPCTwoFa": "bff.bff"
    #"/mtproto.RPCSeamless": "bff.bff"
    #"/mtproto.RPCVoipCalls": "bff.bff"
    "/mtproto.RPCChannels": "bff.bff"
    #"/mtproto.RPCChats": "bff.bff"
    "/mtproto.RPCDeepLinks": "bff.bff"
    "/mtproto.RPCFiles": "bff.bff"
    #"/mtproto.RPCWebPage": "bff.bff"
    #"/mtproto.RPCSecretChats": "bff.bff"
    #"/mtproto.RPCPassport": "bff.bff"
    "/mtproto.RPCUpdates": "bff.bff"
    #"/mtproto.RPCInlineBot": "bff.bff"
    # Managed bots: bots.createBot, bots.getBotInfo, and the other RPCBots methods.
    "/mtproto.RPCBots": "bff.bff"
    # bots.getBotRecommendations and bots.setCustomVerification.
    "/mtproto.RPCBotVerificationIcons": "bff.bff"
    # bots.updateStarRefProgram. Other methods on this service are payments and stay unimplemented.
    "/mtproto.RPCAffiliatePrograms": "bff.bff"
    # help.setBotUpdatesStatus, bots.sendCustomRequest, bots.answerWebhookJSONQuery.
    "/mtproto.RPCInternalBot": "bff.bff"
    # bots.setBotMenuButton and bots.getBotMenuButton.
    "/mtproto.RPCBotMenuButton": "bff.bff"
    # bots.setBotGroupDefaultAdminRights and bots.setBotBroadcastDefaultAdminRights.
    "/mtproto.RPCBotAdminRight": "bff.bff"
    #"/mtproto.RPCThemes": "bff.bff"
    "/mtproto.RPCContacts": "bff.bff"
    #"/mtproto.RPCCreditCards": "bff.bff"
    "/mtproto.RPCDialogs": "bff.bff"
    "/mtproto.RPCDrafts": "bff.bff"
    "/mtproto.RPCEmoji": "bff.bff"
    "/mtproto.RPCEmojiCategories": "bff.bff"
    "/mtproto.RPCCustomEmojis": "bff.bff"
    # Dialog folders (messages.getDialogFilters and the other folder RPCs).
    "/mtproto.RPCFolders": "bff.bff"
    "/mtproto.RPCFolderTags": "bff.bff"
    # messages.getEmojiGameInfo and the game score RPCs.
    "/mtproto.RPCGames": "bff.bff"
    # Group and conference calls.
    "/mtproto.RPCGroupCalls": "bff.bff"
    "/mtproto.RPCConferenceCalls": "bff.bff"
    #"/mtproto.RPCImportedChats": "bff.bff"
    "/mtproto.RPCLangpack": "bff.bff"
    "/mtproto.RPCAutoDownload": "bff.bff"
    # account.getAutoSaveSettings, account.saveAutoSaveSettings, account.deleteAutoSaveExceptions.
    "/mtproto.RPCAutosave": "bff.bff"
    "/mtproto.RPCMessageThreads": "bff.bff"
    "/mtproto.RPCReactions": "bff.bff"
    "/mtproto.RPCMessages": "bff.bff"
    "/mtproto.RPCNotification": "bff.bff"
    # account.getReactionsNotifySettings and account.setReactionsNotifySettings.
    "/mtproto.RPCReactionNotification": "bff.bff"
    "/mtproto.RPCUsers": "bff.bff"
    # account.getTmpPassword. Other payment RPCs on this service stay unimplemented.
    "/mtproto.RPCPayments": "bff.bff"
    #"/mtproto.RPCPolls": "bff.bff"
    #"/mtproto.RPCScheduledMessages": "bff.bff"
    "/mtproto.RPCNsfw": "bff.bff"
    "/mtproto.RPCSponsoredMessages": "bff.bff"
    #"/mtproto.RPCProxyData": "bff.bff"
    "/mtproto.RPCStatistics": "bff.bff"
    "/mtproto.RPCForums": "bff.bff"
    "/mtproto.RPCStickers": "bff.bff"
    # Stories: stories.getAllStories, stories.sendStory, and the other RPCStories methods.
    "/mtproto.RPCStories": "bff.bff"
    "/mtproto.RPCPremium": "bff.bff"
    "/mtproto.RPCEmojiStatus": "bff.bff"
    "/mtproto.RPCAccentColors": "bff.bff"
    "/mtproto.RPCTranscription": "bff.bff"
    "/mtproto.RPCAccount": "bff.bff"
    # RPCPhotos is not a bff service. Photo RPCs are RPCUserChannelProfiles.
    "/mtproto.RPCUserChannelProfiles": "bff.bff"
    "/mtproto.RPCUsernames": "bff.bff"
    #"/mtproto.RPCWallpapers": "bff.bff"
    #"/mtproto.RPCTranslate": "bff.bff"
    # Wallet reads, Ton Connect sessions, and chain refusals. No TON broadcast.
    "/mtproto.RPCWallet": "bff.bff"
    # wallet.setCardStickers. wallet.Card is a layer-232 extra type.
    "/mtproto.RPCWalletCard": "bff.bff"
    # Business hours, location, greeting, away, intro, and chat links.
    "/mtproto.RPCBusinessOpeningHours": "bff.bff"
    "/mtproto.RPCBusinessLocation": "bff.bff"
    "/mtproto.RPCBusinessGreeting": "bff.bff"
    "/mtproto.RPCBusinessIntro": "bff.bff"
    "/mtproto.RPCBusinessChatLinks": "bff.bff"
    # Communities and ephemeral messages. Updates from these RPCs carry no pts.
    "/mtproto.RPCCommunities": "bff.bff"
    "/mtproto.RPCEphemeral": "bff.bff"
    # Feed reads. Constructors are layer 233; iOS already sends them.
    # feed.readFeed returns updates with seq 0.
    "/mtproto.RPCFeed": "bff.bff"
    # Android TL_iv.getRichMessage is messages.getRichMessage#501569cf.
    # This registration covers the coverage name. The constructor is RPCMessages.
    "/mtproto.RPCIv": "bff.bff"
    # channels.setBoostsToUnblockRestrictions and premium boost slots.
    # Story boost RPCs on this service stay unimplemented.
    "/mtproto.RPCBoosts": "bff.bff"
    # Stars balance, top-up options, and revenue reads. No Stars are minted.
    "/mtproto.RPCStars": "bff.bff"
    # Stars subscriptions. There is no stored subscription to change or fulfill.
    "/mtproto.RPCStarSubscriptions": "bff.bff"
    # Giveaway options and lookups. No prepaid giveaway is launched.
    "/mtproto.RPCGiveaways": "bff.bff"
    # Gift-code checks. No code is issued or applied.
    "/mtproto.RPCGiftCodes": "bff.bff"
    # Star gift catalog, saved gifts, resale, auctions, and offers.
    # There is no gift inventory. Android TL_stars.* uses these constructors.
    "/mtproto.RPCGifts": "bff.bff"
    # Star gift collection titles. Gifts are not attached to a collection.
    "/mtproto.RPCGiftCollections": "bff.bff"
    # fragment.getCollectibleInfo. No Fragment purchase record is stored.
    # RPCFragment stays the username service.
    "/mtproto.RPCFragmentCollectibles": "bff.bff"
    # payments.deleteStarGift, withdrawStarGift, depositStarGift, displayStarGift.
    # Constructors are layer 232. The vendored RPCGifts service does not include them.
    "/mtproto.RPCStarGiftHost": "bff.bff"
