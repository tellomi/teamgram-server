# Opt-in memory caps (D-34, M7). deploy-pull.sh includes this file only when
# TELLOMI_COMPOSE_LIMITS=1 and this file is in the checkout. Until that switch
# is set on Chengdu, production limits are unchanged.
#
# mem_limit is what `docker compose up` applies. deploy.resources.limits is
# the same value for Compose versions that read the deploy block.
# asr stays 1536m, matching docker-compose.yaml.
#
# Redis has no maxmemory and no eviction policy. At 512m the process is
# killed instead of dropping idgen or pts keys.
#
# Host RAM in this repo is 7.1G (Chengdu). Caps are ceilings and can sum past
# that. memswap_limit equals mem_limit so a container cannot swap a second
# copy of its cap; that RAM stays for the OS and the 03:15 backup.
# content-engine is not a service here. See docs/ops/COMPOSE_LIMITS.md.
# This file does not set ENGINE_COLIKE.

services:
  # Chengdu sat on the 2560m cgroup: reclaim pinned a CPU and clients stayed
  # on "connecting". The host is already 3584m (3.5 GiB); this matches it.
  teamgram:
    mem_limit: 3584m
    memswap_limit: 3584m
    deploy:
      resources:
        limits:
          memory: 3584m

  mysql:
    mem_limit: 1536m
    memswap_limit: 1536m
    deploy:
      resources:
        limits:
          memory: 1536m
    # command replaces the command in docker-compose-env.yaml, so the charset
    # flags are repeated. 1G is the cap inside the 1.5G cgroup.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=1G

  # Chengdu RSS is about 956MiB with the image default heap (-Xmx1G -Xms1G,
  # from kafka-server-start.sh when KAFKA_HEAP_OPTS is unset). A 1.2g cap
  # is under a full 1G heap plus metaspace, threads, and page cache, and
  # -Xmx768m is smaller than the broker already runs. Keep the 1G heap.
  # 1.6g is that heap plus about 600MiB, so a later `up -d kafka` is not
  # OOM-killed. A generic "heap + 1GiB" cap would be 2g; on a 7.1G host
  # 1.6g still covers the measured process. Caps are ceilings, not
  # reservations, and the other caps can already sum past 7.1G.
  kafka:
    mem_limit: 1.6g
    memswap_limit: 1.6g
    deploy:
      resources:
        limits:
          memory: 1.6g
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"

  redis:
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m

  etcd:
    mem_limit: 256m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  coturn:
    mem_limit: 256m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  mediamtx:
    mem_limit: 256m
    memswap_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  # Same 1536m and 2 cpus as docker-compose.yaml. Both fields are set
  # because Compose rejects cpus and deploy.resources.limits.cpus when they differ.
  asr:
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "2"
