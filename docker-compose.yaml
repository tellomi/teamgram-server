services:
  teamgram:
    # CI pushes this image (see docs/ci-acr.md). The server pulls it and must
    # not build. `build` stays so local dev can still run `docker compose up --build`.
    image: "${TELLOMI_IMAGE_REGISTRY:-crpi-tge4xmtf4iip17mq.cn-chengdu.personal.cr.aliyuncs.com/tellomi}/teamgram:${TELLOMI_IMAGE_TAG:-latest}"
    build: .
    restart: unless-stopped
    # gnetway closes client sockets on SIGTERM. The default 10s grace kills
    # the process before that FIN is sent, and clients wait out the 300s
    # connection idle timer.
    stop_grace_period: 25s
    # SMS: unset TELLOMI_SMS_PROVIDER keeps the dev code 12345.
    # Set it to aliyun plus ALIBABA_CLOUD_ACCESS_KEY_* for Dysmsapi.
    # Email OTP defaults to log (prints the code). Production OTP uses
    # TELLOMI_EMAIL_PROVIDER=resend and TELLOMI_RESEND_API_KEY.
    # postal plus TELLOMI_POSTAL_* is a legacy optional sender.
    # Phone SMS is unchanged. See docs/sms-email.md and docs/email-signup.md.
    # Put secrets in the environment or a gitignored .env, not in this file.
    environment:
      TELLOMI_SMS_PROVIDER: ${TELLOMI_SMS_PROVIDER:-}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      TELLOMI_ALIYUN_REGION: ${TELLOMI_ALIYUN_REGION:-cn-hangzhou}
      TELLOMI_ALIYUN_SMS_SIGN_NAME: ${TELLOMI_ALIYUN_SMS_SIGN_NAME:-}
      TELLOMI_ALIYUN_SMS_TEMPLATE_CODE: ${TELLOMI_ALIYUN_SMS_TEMPLATE_CODE:-}
      TELLOMI_SMS_ALLOW_INTERNATIONAL: ${TELLOMI_SMS_ALLOW_INTERNATIONAL:-false}
      TELLOMI_EMAIL_PROVIDER: ${TELLOMI_EMAIL_PROVIDER:-log}
      TELLOMI_EMAIL_FROM: ${TELLOMI_EMAIL_FROM:-noreply@tellomi.app}
      TELLOMI_EMAIL_FROM_NAME: ${TELLOMI_EMAIL_FROM_NAME:-Tellomi}
      TELLOMI_RESEND_API_KEY: ${TELLOMI_RESEND_API_KEY:-}
      TELLOMI_POSTAL_BASE_URL: ${TELLOMI_POSTAL_BASE_URL:-}
      TELLOMI_POSTAL_API_KEY: ${TELLOMI_POSTAL_API_KEY:-}
      # S3-compatible object storage. Defaults talk to the MinIO service in
      # docker-compose-env.yaml. Point these at Cloudflare R2 without rebuilding
      # the image. See docs/storage.md.
      TELLOMI_S3_ENDPOINT: ${TELLOMI_S3_ENDPOINT:-http://minio:9000}
      TELLOMI_S3_REGION: ${TELLOMI_S3_REGION:-us-east-1}
      TELLOMI_S3_ACCESS_KEY_ID: ${TELLOMI_S3_ACCESS_KEY_ID:-minio}
      TELLOMI_S3_SECRET_ACCESS_KEY: ${TELLOMI_S3_SECRET_ACCESS_KEY:-miniostorage}
      TELLOMI_S3_FORCE_PATH_STYLE: ${TELLOMI_S3_FORCE_PATH_STYLE:-true}
      # Empty follows the endpoint scheme (https enables TLS). A default of
      # false forces plain HTTP and makes dfs miss objects written to R2.
      TELLOMI_S3_USE_SSL: ${TELLOMI_S3_USE_SSL:-}
      TELLOMI_S3_BUCKET_ATTACHMENTS: ${TELLOMI_S3_BUCKET_ATTACHMENTS:-tellomi-attachments}
      TELLOMI_S3_BUCKET_PUBLIC_MEDIA: ${TELLOMI_S3_BUCKET_PUBLIC_MEDIA:-tellomi-public-media}
      TELLOMI_S3_BUCKET_BACKUPS: ${TELLOMI_S3_BUCKET_BACKUPS-tellomi-backups}
      TELLOMI_S3_PUBLIC_MEDIA_BASE_URL: ${TELLOMI_S3_PUBLIC_MEDIA_BASE_URL:-}
      TELLOMI_S3_ATTACHMENTS_BASE_URL: ${TELLOMI_S3_ATTACHMENTS_BASE_URL:-}
      # Public RTMP ingest base returned by phone.getGroupCallStreamRtmpUrl.
      TELLOMI_RTMP_URL: ${TELLOMI_RTMP_URL:-rtmp://127.0.0.1:1935/live}
      # 1:1 call addresses written into phoneCall.connections. Phone hosts in
      # teamgramd/etc2/bff.yaml are empty. Unset TELLOMI_CALL_IP falls back to
      # 127.0.0.1 (localhost only). Unset TELLOMI_TURN_HOST follows that
      # address; unset TELLOMI_STUN_HOST follows TURN. Do not put 127.0.0.1
      # in yaml StunHost: TELLOMI_TURN_HOST would not replace it. See docs/calls.md.
      TELLOMI_CALL_IP: ${TELLOMI_CALL_IP:-}
      TELLOMI_CALL_IPV6: ${TELLOMI_CALL_IPV6:-}
      TELLOMI_TURN_HOST: ${TELLOMI_TURN_HOST:-}
      TELLOMI_TURN_PORT: ${TELLOMI_TURN_PORT:-}
      TELLOMI_STUN_HOST: ${TELLOMI_STUN_HOST:-}
      TELLOMI_STUN_PORT: ${TELLOMI_STUN_PORT:-}
      TELLOMI_TURN_SECRET: ${TELLOMI_TURN_SECRET:-}
      TELLOMI_TURN_TTL: ${TELLOMI_TURN_TTL:-}
      TELLOMI_TURN_SERVERS: ${TELLOMI_TURN_SERVERS:-}
      TELLOMI_STUN_SERVERS: ${TELLOMI_STUN_SERVERS:-}
      TELLOMI_REFLECTOR_PORT: ${TELLOMI_REFLECTOR_PORT:-}
      TELLOMI_ENABLE_P2P: ${TELLOMI_ENABLE_P2P:-}
      TELLOMI_CALL_FORCE_TCP: ${TELLOMI_CALL_FORCE_TCP:-}
      # Link preview runs in this container (teamgramd/bin/runall-docker.sh).
      # Empty token, DSN, media key, and MinIO credentials keep the values in
      # teamgramd/etc2/linkpreview.yaml. See docs/link-preview.md.
      TELLOMI_LINKPREVIEW_ADDR: ${TELLOMI_LINKPREVIEW_ADDR:-0.0.0.0:8801}
      TELLOMI_LINKPREVIEW_MYSQL_DSN: ${TELLOMI_LINKPREVIEW_MYSQL_DSN:-}
      TELLOMI_LINKPREVIEW_TOKEN: ${TELLOMI_LINKPREVIEW_TOKEN:-}
      TELLOMI_LINKPREVIEW_PUBLIC_URL: ${TELLOMI_LINKPREVIEW_PUBLIC_URL:-}
      TELLOMI_LINKPREVIEW_MEDIA_KEY: ${TELLOMI_LINKPREVIEW_MEDIA_KEY:-}
      TELLOMI_LINK_BASE_URL: ${TELLOMI_LINK_BASE_URL:-https://tell.cc}
      TELLOMI_LINKPREVIEW_RATE_PER_MIN: ${TELLOMI_LINKPREVIEW_RATE_PER_MIN:-120}
      TELLOMI_LINKPREVIEW_RATE_BURST: ${TELLOMI_LINKPREVIEW_RATE_BURST:-40}
      TELLOMI_LINKPREVIEW_CACHE_SECONDS: ${TELLOMI_LINKPREVIEW_CACHE_SECONDS:-120}
      TELLOMI_LINKPREVIEW_TRUST_PROXY: ${TELLOMI_LINKPREVIEW_TRUST_PROXY:-true}
      TELLOMI_MINIO_ENDPOINT: ${TELLOMI_MINIO_ENDPOINT:-minio:9000}
      TELLOMI_MINIO_ACCESS_KEY: ${TELLOMI_MINIO_ACCESS_KEY:-}
      TELLOMI_MINIO_SECRET_KEY: ${TELLOMI_MINIO_SECRET_KEY:-}
      TELLOMI_MINIO_USE_SSL: ${TELLOMI_MINIO_USE_SSL:-false}
      TELLOMI_MINIO_BUCKET_PHOTOS: ${TELLOMI_MINIO_BUCKET_PHOTOS:-photos}
      TELLOMI_MINIO_BUCKET_DOCUMENTS: ${TELLOMI_MINIO_BUCKET_DOCUMENTS:-documents}
      TELLOMI_MINIO_BUCKET_VIDEOS: ${TELLOMI_MINIO_BUCKET_VIDEOS:-videos}
      # APNs token auth (.p8). Leave the key unset to disable push.
      # TestFlight and the App Store use production (TELLOMI_APNS_SANDBOX=false).
      # Mount the key with TELLOMI_APNS_KEY_FILE=/path/AuthKey_XXXX.p8
      # See docs/push.md.
      TELLOMI_APNS_KEY_ID: ${TELLOMI_APNS_KEY_ID:-}
      TELLOMI_APNS_TEAM_ID: ${TELLOMI_APNS_TEAM_ID:-}
      TELLOMI_APNS_TOPIC: ${TELLOMI_APNS_TOPIC:-}
      TELLOMI_APNS_KEY_PATH: ${TELLOMI_APNS_KEY_PATH:-/etc/tellomi/apns/AuthKey.p8}
      TELLOMI_APNS_SANDBOX: ${TELLOMI_APNS_SANDBOX:-false}
      # Schema migration on startup (teamgramd/deploy/migrate.sh). Root matches
      # the MySQL service; the app processes still use the DSN in etc2/*.yaml.
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_MIGRATE_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teamgram}
    volumes:
      - ./data/logs:/app/logs
      - ${TELLOMI_APNS_KEY_FILE:-/dev/null}:/etc/tellomi/apns/AuthKey.p8:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "10443:10443"
      - "11443:11443"
      - "3479:3479/udp"
      - "3480:3480/udp"
      - "20450:20450"
      - "20010:20010"
      - "20020:20020"
      - "20640:20640"
      - "20110:20110"
      - "5222:5222"
      - "8801:8801" # linkpreview HTTP (GET /linkpreview/v1/resolve)
      - "20660:20660"
      - "20650:20650"
      - "20030:20030"
      - "20120:20120"
      - "20670:20670"
      - "20420:20420"
    # Honored when this file is combined with docker-compose-env.yaml, which
    # defines kafka and its healthcheck. required: false keeps `docker compose up`
    # of this file alone from failing. The processes also keep retrying Kafka
    # in-process if the broker drops later.
    depends_on:
      kafka:
        condition: service_healthy
        required: false
    networks:
      - teamgram_net

  # TURN/STUN for phoneConnectionWebrtc. Username is "<expiry>:<user>" and the
  # password is base64(HMAC-SHA1(static-auth-secret, username)). The secret must
  # match TELLOMI_TURN_SECRET. Host networking so relay candidates use the
  # public address. See docs/calls.md.
  coturn:
    image: coturn/coturn:4.6.2
    restart: always
    network_mode: host
    environment:
      TURN_EXTERNAL_IP: ${TELLOMI_TURN_EXTERNAL_IP:-${TELLOMI_CALL_IP:-127.0.0.1}}
      TURN_RELAY_IP: ${TELLOMI_TURN_RELAY_IP:-}
      TURN_SECRET: ${TELLOMI_TURN_SECRET:-tellomi-turn-secret}
      TURN_REALM: ${TELLOMI_TURN_REALM:-tellomi}
      TURN_MIN_PORT: ${TELLOMI_TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TELLOMI_TURN_MAX_PORT:-49200}
      TURN_LISTEN_PORT: ${TELLOMI_TURN_PORT:-3478}
      TURN_TLS_PORT: ${TELLOMI_TURN_TLS_PORT:-5349}
    volumes:
      - ./teamgramd/deploy/coturn/entrypoint.sh:/opt/coturn/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/coturn/entrypoint.sh"]

  # RTMP ingest for phone.getGroupCallStreamRtmpUrl. This accepts the push;
  # it is not bridged into the group-call SFU (see app/bff/phone/LIMITATIONS.md).
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: always
    ports:
      - "1935:1935"
      - "8889:8889"
    networks:
      - teamgram_net

networks:
  teamgram_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
