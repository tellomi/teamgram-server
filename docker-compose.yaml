services:
  teamgram:
    # CI pushes this image (see docs/ci-acr.md). The server pulls it and must
    # not build. `build` stays so local dev can still run `docker compose up --build`.
    # Deploy pins this to the 7-character commit SHA. deploy-pull.sh replaces
    # an empty tag, "local", or "latest". Do not default to latest: that tag
    # moves, and a pull can start a different build than this checkout.
    image: "${TELLOMI_IMAGE_REGISTRY:-crpi-tge4xmtf4iip17mq.cn-chengdu.personal.cr.aliyuncs.com/tellomi}/teamgram:${TELLOMI_IMAGE_TAG:-local}"
    build: .
    restart: unless-stopped
    # gnetway closes client sockets on SIGTERM. The default 10s grace kills
    # the process before that FIN is sent, and clients wait out the 300s
    # connection idle timer.
    stop_grace_period: 25s
    # SMS: unset TELLOMI_SMS_PROVIDER keeps the dev code 12345.
    # Set it to aliyun plus ALIBABA_CLOUD_ACCESS_KEY_* for Dysmsapi.
    # A failed or stalled SendSms returns SMS_CODE_CREATE_FAILED within 10s.
    # Email OTP defaults to log (prints the code). Production OTP uses
    # TELLOMI_EMAIL_PROVIDER=resend and TELLOMI_RESEND_API_KEY.
    # postal plus TELLOMI_POSTAL_* is a legacy optional sender.
    # Phone SMS is unchanged. See docs/sms-email.md and docs/email-signup.md.
    # Put secrets in the environment or a gitignored .env, not in this file.
    environment:
      TELLOMI_SMS_PROVIDER: ${TELLOMI_SMS_PROVIDER:-}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      TELLOMI_ALIYUN_REGION: ${TELLOMI_ALIYUN_REGION:-cn-hangzhou}
      TELLOMI_ALIYUN_SMS_SIGN_NAME: ${TELLOMI_ALIYUN_SMS_SIGN_NAME:-}
      TELLOMI_ALIYUN_SMS_TEMPLATE_CODE: ${TELLOMI_ALIYUN_SMS_TEMPLATE_CODE:-}
      TELLOMI_SMS_ALLOW_INTERNATIONAL: ${TELLOMI_SMS_ALLOW_INTERNATIONAL:-false}
      TELLOMI_EMAIL_PROVIDER: ${TELLOMI_EMAIL_PROVIDER:-log}
      TELLOMI_EMAIL_FROM: ${TELLOMI_EMAIL_FROM:-noreply@tellomi.app}
      TELLOMI_EMAIL_FROM_NAME: ${TELLOMI_EMAIL_FROM_NAME:-Tellomi}
      TELLOMI_RESEND_API_KEY: ${TELLOMI_RESEND_API_KEY:-}
      TELLOMI_POSTAL_BASE_URL: ${TELLOMI_POSTAL_BASE_URL:-}
      TELLOMI_POSTAL_API_KEY: ${TELLOMI_POSTAL_API_KEY:-}
      # S3-compatible object storage. Defaults talk to the MinIO service in
      # docker-compose-env.yaml. Point these at Cloudflare R2 without rebuilding
      # the image. See docs/storage.md.
      TELLOMI_S3_ENDPOINT: ${TELLOMI_S3_ENDPOINT:-http://minio:9000}
      TELLOMI_S3_REGION: ${TELLOMI_S3_REGION:-us-east-1}
      TELLOMI_S3_ACCESS_KEY_ID: ${TELLOMI_S3_ACCESS_KEY_ID:-minio}
      TELLOMI_S3_SECRET_ACCESS_KEY: ${TELLOMI_S3_SECRET_ACCESS_KEY:-miniostorage}
      TELLOMI_S3_FORCE_PATH_STYLE: ${TELLOMI_S3_FORCE_PATH_STYLE:-true}
      # Empty follows the endpoint scheme (https enables TLS). A default of
      # false forces plain HTTP and makes dfs miss objects written to R2.
      TELLOMI_S3_USE_SSL: ${TELLOMI_S3_USE_SSL:-}
      TELLOMI_S3_BUCKET_ATTACHMENTS: ${TELLOMI_S3_BUCKET_ATTACHMENTS:-tellomi-attachments}
      TELLOMI_S3_BUCKET_PUBLIC_MEDIA: ${TELLOMI_S3_BUCKET_PUBLIC_MEDIA:-tellomi-public-media}
      TELLOMI_S3_BUCKET_BACKUPS: ${TELLOMI_S3_BUCKET_BACKUPS-tellomi-backups}
      TELLOMI_S3_PUBLIC_MEDIA_BASE_URL: ${TELLOMI_S3_PUBLIC_MEDIA_BASE_URL:-}
      TELLOMI_S3_ATTACHMENTS_BASE_URL: ${TELLOMI_S3_ATTACHMENTS_BASE_URL:-}
      # Public RTMP ingest base returned by phone.getGroupCallStreamRtmpUrl.
      TELLOMI_RTMP_URL: ${TELLOMI_RTMP_URL:-rtmp://127.0.0.1:1935/live}
      # Empty disables the OTLP exporter. Set jaeger:4317 only when a collector is up.
      TELLOMI_OTEL_ENDPOINT: ${TELLOMI_OTEL_ENDPOINT:-}
      # 1:1 call addresses written into phoneCall.connections. Phone hosts in
      # teamgramd/etc2/bff.yaml are empty. Unset TELLOMI_CALL_IP falls back to
      # 127.0.0.1 (localhost only). Unset TELLOMI_TURN_HOST follows that
      # address; unset TELLOMI_STUN_HOST follows TURN. Do not put 127.0.0.1
      # in yaml StunHost: TELLOMI_TURN_HOST would not replace it. See docs/calls.md.
      TELLOMI_CALL_IP: ${TELLOMI_CALL_IP:-}
      TELLOMI_CALL_IPV6: ${TELLOMI_CALL_IPV6:-}
      TELLOMI_TURN_HOST: ${TELLOMI_TURN_HOST:-}
      TELLOMI_TURN_PORT: ${TELLOMI_TURN_PORT:-}
      TELLOMI_STUN_HOST: ${TELLOMI_STUN_HOST:-}
      TELLOMI_STUN_PORT: ${TELLOMI_STUN_PORT:-}
      TELLOMI_TURN_SECRET: ${TELLOMI_TURN_SECRET:-}
      TELLOMI_TURN_TTL: ${TELLOMI_TURN_TTL:-}
      TELLOMI_TURN_SERVERS: ${TELLOMI_TURN_SERVERS:-}
      TELLOMI_STUN_SERVERS: ${TELLOMI_STUN_SERVERS:-}
      TELLOMI_REFLECTOR_PORT: ${TELLOMI_REFLECTOR_PORT:-}
      TELLOMI_ENABLE_P2P: ${TELLOMI_ENABLE_P2P:-}
      TELLOMI_CALL_FORCE_TCP: ${TELLOMI_CALL_FORCE_TCP:-}
      # Link preview runs in this container (teamgramd/bin/runall-docker.sh).
      # Empty token, DSN, media key, and MinIO credentials keep the values in
      # teamgramd/etc2/linkpreview.yaml. See docs/link-preview.md.
      TELLOMI_LINKPREVIEW_ADDR: ${TELLOMI_LINKPREVIEW_ADDR:-0.0.0.0:8801}
      TELLOMI_LINKPREVIEW_MYSQL_DSN: ${TELLOMI_LINKPREVIEW_MYSQL_DSN:-}
      TELLOMI_LINKPREVIEW_TOKEN: ${TELLOMI_LINKPREVIEW_TOKEN:-}
      TELLOMI_LINKPREVIEW_PUBLIC_URL: ${TELLOMI_LINKPREVIEW_PUBLIC_URL:-}
      TELLOMI_LINKPREVIEW_MEDIA_KEY: ${TELLOMI_LINKPREVIEW_MEDIA_KEY:-}
      TELLOMI_LINK_BASE_URL: ${TELLOMI_LINK_BASE_URL:-https://tell.cc}
      TELLOMI_LINKPREVIEW_RATE_PER_MIN: ${TELLOMI_LINKPREVIEW_RATE_PER_MIN:-120}
      TELLOMI_LINKPREVIEW_RATE_BURST: ${TELLOMI_LINKPREVIEW_RATE_BURST:-40}
      TELLOMI_LINKPREVIEW_CACHE_SECONDS: ${TELLOMI_LINKPREVIEW_CACHE_SECONDS:-120}
      TELLOMI_LINKPREVIEW_TRUST_PROXY: ${TELLOMI_LINKPREVIEW_TRUST_PROXY:-true}
      # Host only (no scheme). R2: <accountid>.r2.cloudflarestorage.com,
      # TELLOMI_MINIO_USE_SSL=true, TELLOMI_MINIO_REGION=auto. See docs/ci-acr.md.
      # Session region. ip2region (in the image) is used for mainland China.
      # The DB-IP Lite city mmdb is mounted by docker-compose.geoip.yaml at
      # /app/bin/GeoLite2-City.mmdb and is used for every other address.
      # Either file may be absent; RPCs still succeed. See docs/ip2region.md.
      IP2REGION_V4_XDB: ${IP2REGION_V4_XDB:-/app/data/ip2region/ip2region_v4.xdb}
      IP2REGION_V6_XDB: ${IP2REGION_V6_XDB:-/app/data/ip2region/ip2region_v6.xdb}
      MMDB: ${MMDB:-${TELLOMI_GEOIP_MMDB:-/app/bin/GeoLite2-City.mmdb}}
      GEOIP_MMDB: ${GEOIP_MMDB:-${TELLOMI_GEOIP_MMDB:-/app/bin/GeoLite2-City.mmdb}}
      TELLOMI_MINIO_ENDPOINT: ${TELLOMI_MINIO_ENDPOINT:-minio:9000}
      TELLOMI_MINIO_REGION: ${TELLOMI_MINIO_REGION:-auto}
      TELLOMI_MINIO_ACCESS_KEY: ${TELLOMI_MINIO_ACCESS_KEY:-}
      TELLOMI_MINIO_SECRET_KEY: ${TELLOMI_MINIO_SECRET_KEY:-}
      TELLOMI_MINIO_USE_SSL: ${TELLOMI_MINIO_USE_SSL:-false}
      TELLOMI_MINIO_BUCKET_PHOTOS: ${TELLOMI_MINIO_BUCKET_PHOTOS:-tellomi-attachments}
      TELLOMI_MINIO_BUCKET_DOCUMENTS: ${TELLOMI_MINIO_BUCKET_DOCUMENTS:-tellomi-attachments}
      TELLOMI_MINIO_BUCKET_VIDEOS: ${TELLOMI_MINIO_BUCKET_VIDEOS:-tellomi-attachments}
      # Chat media retention (docs/media-retention.md). Off unless enabled.
      # Free chats keep photos/videos/voice/files for DAYS after upload;
      # chats with an active subscriber keep them forever (GRACE_DAYS after
      # premium_expire_date). Text, avatars, stickers, GIFs and wallpapers
      # are never removed. RUN_HOUR is the container's local hour.
      TELLOMI_MEDIA_RETENTION_ENABLED: ${TELLOMI_MEDIA_RETENTION_ENABLED:-false}
      TELLOMI_MEDIA_RETENTION_DAYS: ${TELLOMI_MEDIA_RETENTION_DAYS:-90}
      TELLOMI_MEDIA_RETENTION_GRACE_DAYS: ${TELLOMI_MEDIA_RETENTION_GRACE_DAYS:-30}
      TELLOMI_MEDIA_RETENTION_DRY_RUN: ${TELLOMI_MEDIA_RETENTION_DRY_RUN:-true}
      TELLOMI_MEDIA_RETENTION_BATCH: ${TELLOMI_MEDIA_RETENTION_BATCH:-500}
      TELLOMI_MEDIA_RETENTION_MAX_PER_RUN: ${TELLOMI_MEDIA_RETENTION_MAX_PER_RUN:-5000}
      TELLOMI_MEDIA_RETENTION_RUN_HOUR: ${TELLOMI_MEDIA_RETENTION_RUN_HOUR:-4}
      # Voice notes. The asr service below is SenseVoice-Small. Unset is off
      # (trial weekly number 0, clients hide the button). This file ships the
      # sidecar, so the default here is on. See docs/ci-acr.md.
      TELLOMI_TRANSCRIBE_ENABLED: ${TELLOMI_TRANSCRIBE_ENABLED:-true}
      TELLOMI_ASR_URL: ${TELLOMI_ASR_URL:-http://asr:8080}
      TELLOMI_ASR_TIMEOUT: ${TELLOMI_ASR_TIMEOUT:-120}
      # APNs token auth (.p8). Leave the key unset to disable push.
      # TestFlight and the App Store use production (TELLOMI_APNS_SANDBOX=false).
      # Mount the key with TELLOMI_APNS_KEY_FILE=/path/AuthKey_XXXX.p8
      # See docs/push.md.
      TELLOMI_APNS_KEY_ID: ${TELLOMI_APNS_KEY_ID:-}
      TELLOMI_APNS_TEAM_ID: ${TELLOMI_APNS_TEAM_ID:-}
      TELLOMI_APNS_TOPIC: ${TELLOMI_APNS_TOPIC:-}
      # Empty → <TELLOMI_APNS_TOPIC>.voip. Same .p8. Chengdu: app.tellomi.chat.voip.
      TELLOMI_APNS_VOIP_TOPIC: ${TELLOMI_APNS_VOIP_TOPIC:-}
      TELLOMI_APNS_KEY_PATH: ${TELLOMI_APNS_KEY_PATH:-/etc/tellomi/apns/AuthKey.p8}
      TELLOMI_APNS_SANDBOX: ${TELLOMI_APNS_SANDBOX:-false}
      # Xiaomi Push (token_type 14). Unset does not send. See docs/push.md.
      TELLOMI_XIAOMI_PUSH: ${TELLOMI_XIAOMI_PUSH:-}
      TELLOMI_XIAOMI_APP_SECRET: ${TELLOMI_XIAOMI_APP_SECRET:-}
      TELLOMI_XIAOMI_PACKAGE: ${TELLOMI_XIAOMI_PACKAGE:-}
      TELLOMI_XIAOMI_HOST: ${TELLOMI_XIAOMI_HOST:-}
      # help.getAppUpdate. Empty MANIFEST reads a local synced latest.json
      # if one exists, otherwise https://www.tellomi.cn/dl/android/latest.json.
      # off disables that feed. Non-empty VERSION replaces the manifest;
      # leave it empty so each Android release prompts from latest.json.
      # iOS sessions always receive help.noAppUpdate. See .env.example.
      TELLOMI_APP_UPDATE_MANIFEST: ${TELLOMI_APP_UPDATE_MANIFEST:-}
      TELLOMI_APP_UPDATE_VERSION: ${TELLOMI_APP_UPDATE_VERSION:-}
      TELLOMI_APP_UPDATE_TEXT: ${TELLOMI_APP_UPDATE_TEXT:-}
      TELLOMI_APP_UPDATE_URL: ${TELLOMI_APP_UPDATE_URL:-}
      TELLOMI_APP_UPDATE_SOURCE: ${TELLOMI_APP_UPDATE_SOURCE:-}
      TELLOMI_APP_UPDATE_CANNOT_SKIP: ${TELLOMI_APP_UPDATE_CANNOT_SKIP:-}
      # Extra MTProto RSA key. Both empty: gnetway uses RSAKey in
      # teamgramd/etc2/gnetway.yaml. Chengdu sets both; the file is the
      # read-only mount at /etc/tellomi/mtproto/. See docs/SECURITY-OPS.md.
      TELLOMI_MTPROTO_EXTRA_KEY_FILE: ${TELLOMI_MTPROTO_EXTRA_KEY_FILE:-}
      TELLOMI_MTPROTO_EXTRA_KEY_FINGERPRINT: ${TELLOMI_MTPROTO_EXTRA_KEY_FINGERPRINT:-}
      # help.getConfig dc_options. Empty leaves teamgramd/bin/config.json
      # (an empty list, webfile_dc_id 4). A valid spec replaces the list and
      # sets webfile_dc_id to 1. "-" in TELLOMI_DC_TXT_DOMAIN blanks
      # apv2.stel.com; empty leaves it. See docs/ops/DC_ADDRESSES.md.
      TELLOMI_DC_OPTIONS: ${TELLOMI_DC_OPTIONS:-}
      TELLOMI_DC_TXT_DOMAIN: ${TELLOMI_DC_TXT_DOMAIN:-}
      # Username reserve / sensitive-word check (M5). Unset is off.
      # help.getAppConfig faq_link. Unset stays https://tellomi.cn/faq.
      # 1 switches it to https://tellomi.cn/help (D-40). The page is not
      # served by this container.
      TELLOMI_HELP_CENTER: ${TELLOMI_HELP_CENTER:-}
      # About page and the personalized-recommendation default (D-50 / D-58 / D-59).
      # Unset leaves tellomi_personalized_recommend_default false and omits
      # the filing number, model name, and registration number.
      TELLOMI_ABOUT_DISCLOSURE: ${TELLOMI_ABOUT_DISCLOSURE:-}
      TELLOMI_ALGORITHM_FILING_NUMBER: ${TELLOMI_ALGORITHM_FILING_NUMBER:-}
      TELLOMI_AI_PUBLIC_MODEL: ${TELLOMI_AI_PUBLIC_MODEL:-}
      TELLOMI_AI_REGISTRATION_NUMBER: ${TELLOMI_AI_REGISTRATION_NUMBER:-}
      TELLOMI_USERNAME_POLICY: ${TELLOMI_USERNAME_POLICY:-}
      # Aliyun Green / Bailian text moderation for Han display names,
      # bios, and group titles.
      # Unset is off. 1 or aliyun calls TextModeration. bailian calls
      # TextModerationPlus. A timeout or HTTP error allows the name.
      # Keys fall back to ALIBABA_CLOUD_ACCESS_KEY_*. See pkg/contentsafety.
      TELLOMI_CONTENT_SAFETY: ${TELLOMI_CONTENT_SAFETY:-}
      TELLOMI_CONTENT_SAFETY_ENDPOINT: ${TELLOMI_CONTENT_SAFETY_ENDPOINT:-}
      TELLOMI_CONTENT_SAFETY_SERVICE: ${TELLOMI_CONTENT_SAFETY_SERVICE:-}
      TELLOMI_CONTENT_SAFETY_TIMEOUT: ${TELLOMI_CONTENT_SAFETY_TIMEOUT:-}
      TELLOMI_CONTENT_SAFETY_ACCESS_KEY_ID: ${TELLOMI_CONTENT_SAFETY_ACCESS_KEY_ID:-}
      TELLOMI_CONTENT_SAFETY_ACCESS_KEY_SECRET: ${TELLOMI_CONTENT_SAFETY_ACCESS_KEY_SECRET:-}
      # Discover credential (M3). Unset is off. Keys are standard base64.
      # See docs/discover-engine-auth.md. Do not commit key values.
      TELLOMI_DISCOVER: ${TELLOMI_DISCOVER:-}
      TELLOMI_DISCOVER_SIGNING_KEY: ${TELLOMI_DISCOVER_SIGNING_KEY:-}
      TELLOMI_DISCOVER_PSEUDONYM_KEY: ${TELLOMI_DISCOVER_PSEUDONYM_KEY:-}
      # Live contact / close-friend checks for content-engine. Unset is off.
      # See docs/discover-relations.md. Do not publish this port.
      TELLOMI_DISCOVER_RELATIONS: ${TELLOMI_DISCOVER_RELATIONS:-}
      TELLOMI_DISCOVER_RELATION_KEY: ${TELLOMI_DISCOVER_RELATION_KEY:-}
      TELLOMI_DISCOVER_RELATION_ADDR: ${TELLOMI_DISCOVER_RELATION_ADDR:-}
      # Privacy-filtered profile cards for content-engine. Unset is off.
      # See docs/discover-profiles.md. Do not publish this port.
      TELLOMI_DISCOVER_PROFILES: ${TELLOMI_DISCOVER_PROFILES:-}
      TELLOMI_DISCOVER_PROFILE_KEY: ${TELLOMI_DISCOVER_PROFILE_KEY:-}
      TELLOMI_DISCOVER_PROFILE_ADDR: ${TELLOMI_DISCOVER_PROFILE_ADDR:-}
      # Account deletion notifies content-engine. Unset is off.
      # See docs/discover-account-deletion.md.
      TELLOMI_DISCOVER_DELETE: ${TELLOMI_DISCOVER_DELETE:-}
      TELLOMI_DISCOVER_ENGINE_URL: ${TELLOMI_DISCOVER_ENGINE_URL:-}
      TELLOMI_DISCOVER_SERVICE_KEY: ${TELLOMI_DISCOVER_SERVICE_KEY:-}
      # Discover system pushes. Unset is off. See docs/api/discover-ai.md.
      # Do not publish this port.
      TELLOMI_DISCOVER_PUSH: ${TELLOMI_DISCOVER_PUSH:-}
      TELLOMI_DISCOVER_PUSH_KEY: ${TELLOMI_DISCOVER_PUSH_KEY:-}
      TELLOMI_DISCOVER_PUSH_ADDR: ${TELLOMI_DISCOVER_PUSH_ADDR:-}
      # @tellomi. Unset is off. See docs/api/tellomi-ai.md. Do not publish the port.
      TELLOMI_AI: ${TELLOMI_AI:-}
      TELLOMI_AI_API_KEY: ${TELLOMI_AI_API_KEY:-}
      TELLOMI_AI_BASE_URL: ${TELLOMI_AI_BASE_URL:-}
      TELLOMI_AI_MODEL_PRIMARY: ${TELLOMI_AI_MODEL_PRIMARY:-}
      TELLOMI_AI_MODEL_SMALL: ${TELLOMI_AI_MODEL_SMALL:-}
      TELLOMI_AI_MODEL_FALLBACK: ${TELLOMI_AI_MODEL_FALLBACK:-}
      TELLOMI_AI_TIMEOUT_SECONDS: ${TELLOMI_AI_TIMEOUT_SECONDS:-}
      TELLOMI_AI_MONTHLY_BUDGET: ${TELLOMI_AI_MONTHLY_BUDGET:-}
      TELLOMI_AI_PRICE_PER_1K: ${TELLOMI_AI_PRICE_PER_1K:-}
      TELLOMI_AI_INTERNAL_KEY: ${TELLOMI_AI_INTERNAL_KEY:-}
      TELLOMI_AI_ADDR: ${TELLOMI_AI_ADDR:-}
      # messages.translateText / translateRichMessage. Unset is off.
      # Requires TELLOMI_AI_API_KEY. Off or a model failure is TRANSLATE_REQ_FAILED.
      TELLOMI_TRANSLATE: ${TELLOMI_TRANSLATE:-}
      # messages.composeRichMessageWithAI. Unset is off. tellomi_ai_compose_enabled
      # is true only together with TELLOMI_AI_API_KEY. Off is AICOMPOSE_TIMEOUT.
      TELLOMI_AI_COMPOSE: ${TELLOMI_AI_COMPOSE:-}
      # Launch notices from @admin. Unset is off. See docs/api/announce.md.
      # Do not publish this port. This does not run during login.
      TELLOMI_ANNOUNCE: ${TELLOMI_ANNOUNCE:-}
      TELLOMI_ANNOUNCE_KEY: ${TELLOMI_ANNOUNCE_KEY:-}
      TELLOMI_ANNOUNCE_ADDR: ${TELLOMI_ANNOUNCE_ADDR:-}
      TELLOMI_ANNOUNCE_FROM: ${TELLOMI_ANNOUNCE_FROM:-}
      TELLOMI_ANNOUNCE_GAP_MS: ${TELLOMI_ANNOUNCE_GAP_MS:-}
      # Rewrites teamgram:<password>@tcp(mysql:3306) in /app/etc2 at start.
      # The dev default matches the database created by docker-compose-env.yaml.
      # Production .env sets MYSQL_PASSWORD. See docs/SECURITY-OPS.md.
      TEAMGRAM_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teamgram}
      # Schema migration on startup (teamgramd/deploy/migrate.sh). Root matches
      # the MySQL service. App DSNs in etc2 are rewritten from TEAMGRAM_MYSQL_PASSWORD.
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_MIGRATE_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teamgram}
    volumes:
      - ./data/logs:/app/logs
      - ${TELLOMI_APNS_KEY_FILE:-/dev/null}:/etc/tellomi/apns/AuthKey.p8:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "10443:10443"
      - "11443:11443"
      - "3479:3479/udp"
      - "3480:3480/udp"
      - "20450:20450"
      - "20010:20010"
      - "20020:20020"
      - "20640:20640"
      - "20110:20110"
      - "5222:5222"
      - "8801:8801" # linkpreview HTTP (GET /linkpreview/v1/resolve)
      # Web account deletion. Bind the host side to loopback; nginx on the
      # same machine proxies chat.tellomi.cn. See docs/account-deletion-web.md.
      - "127.0.0.1:8802:8802"
      - "20660:20660"
      - "20650:20650"
      - "20030:20030"
      - "20120:20120"
      - "20670:20670"
      - "20420:20420"
    # Honored when this file is combined with docker-compose-env.yaml, which
    # defines kafka and its healthcheck. required: false keeps `docker compose up`
    # of this file alone from failing. The processes also keep retrying Kafka
    # in-process if the broker drops later.
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      # required: false so a stack that disables asr (CI profile) still starts.
      # When asr is in the project, teamgram waits until the model is loaded.
      asr:
        condition: service_healthy
        required: false
    networks:
      - teamgram_net

  # TURN/STUN for phoneConnectionWebrtc. Username is "<expiry>:<user>" and the
  # password is base64(HMAC-SHA1(static-auth-secret, username)). The secret must
  # match TELLOMI_TURN_SECRET. Host networking so relay candidates use the
  # public address. See docs/calls.md.
  coturn:
    image: coturn/coturn:4.6.2
    restart: always
    network_mode: host
    environment:
      TURN_EXTERNAL_IP: ${TELLOMI_TURN_EXTERNAL_IP:-${TELLOMI_CALL_IP:-127.0.0.1}}
      TURN_RELAY_IP: ${TELLOMI_TURN_RELAY_IP:-}
      TURN_SECRET: ${TELLOMI_TURN_SECRET:-tellomi-turn-secret}
      TURN_REALM: ${TELLOMI_TURN_REALM:-tellomi}
      TURN_MIN_PORT: ${TELLOMI_TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TELLOMI_TURN_MAX_PORT:-49200}
      TURN_LISTEN_PORT: ${TELLOMI_TURN_PORT:-3478}
      TURN_TLS_PORT: ${TELLOMI_TURN_TLS_PORT:-5349}
    volumes:
      - ./teamgramd/deploy/coturn/entrypoint.sh:/opt/coturn/entrypoint.sh:ro
    # Do not point entrypoint at the bind mount alone. A host file that
    # replaces volumes (`volumes: !override` in docker-compose.tellomi.yaml)
    # drops this file, and coturn then crash-loops. Chengdu set
    # `entrypoint: !reset null` to get the image entrypoint back.
    # When the script is mounted, it writes /tmp/turnserver.conf from TURN_* .
    # When it is not, this shell execs the image entrypoint
    # (docker-entrypoint.sh) with the image command, which is what
    # `entrypoint: !reset null` starts. The image reads turnserver.conf,
    # including /etc/coturn/turnserver.conf. `$$` is a Compose escape.
    # The word after the script is $0, so the image command is "$@".
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /opt/coturn/entrypoint.sh ]; then
          exec /bin/sh /opt/coturn/entrypoint.sh
        fi
        exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh

  # SenseVoice-Small (int8 ONNX via sherpa-onnx). CPU only. The weights are
  # in the image; the container does not download them. 1.5GB / 2 CPUs matches
  # the Chengdu host. See services/asr/NOTICE for the model license.
  asr:
    image: "${TELLOMI_IMAGE_REGISTRY:-crpi-tge4xmtf4iip17mq.cn-chengdu.personal.cr.aliyuncs.com/tellomi}/asr:${TELLOMI_IMAGE_TAG:-local}"
    build:
      context: ./services/asr
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    environment:
      ASR_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - teamgram_net

  # RTMP ingest for phone.getGroupCallStreamRtmpUrl. This accepts the push;
  # it is not bridged into the group-call SFU (see app/bff/phone/LIMITATIONS.md).
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: always
    ports:
      - "1935:1935"
      - "8889:8889"
    networks:
      - teamgram_net

networks:
  teamgram_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
