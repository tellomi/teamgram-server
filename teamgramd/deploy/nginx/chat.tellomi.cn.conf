# Snippet for the host nginx in front of chat.tellomi.cn.
# The deletion API and page are served by the teamgram container on
# 127.0.0.1:8802. Do not publish 8802 on a public interface.
#
# Install: copy the two location blocks into the existing chat.tellomi.cn
# server { } that already terminates TLS. nginx -t && nginx -s reload.
# Rollback: remove the two blocks and reload. The old static files, if still
# on disk, start answering /delete-account/ again. See docs/account-deletion-web.md.

location /delete-account/ {
    proxy_pass http://127.0.0.1:8802;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /v1/verification/session {
    proxy_pass http://127.0.0.1:8802;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /v1/tellomi/account-deletion {
    proxy_pass http://127.0.0.1:8802;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
