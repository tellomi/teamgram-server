# Example coturn config. docker-compose does not mount this file.
# teamgramd/deploy/coturn/entrypoint.sh writes the live config from TURN_* env.
# external-ip must be the address in Phone.PublicIP / TELLOMI_CALL_IP.
# static-auth-secret must match Phone.TurnSecret / TELLOMI_TURN_SECRET.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=127.0.0.1
min-port=49160
max-port=49200
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=tellomi-turn-secret
realm=tellomi
no-multicast-peers
no-cli
log-file=stdout
simple-log
