Name: service.status
ListenOn: 0.0.0.0:20670
Etcd:
  Hosts:
    - etcd:2379
  Key: service.status
Log:
  ServiceName: service.status
  Mode: file
  Path: /app/logs/status
  KeepDays: 7
  Rotation: daily
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20671
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.status
  # Empty unless TELLOMI_OTEL_ENDPOINT is set. No exporter, no export errors.
  Endpoint: ${TELLOMI_OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
  
Status:
  - Host: redis:6379

StatusExpire: 90