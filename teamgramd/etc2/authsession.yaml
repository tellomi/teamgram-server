Name: service.authsession
ListenOn: 0.0.0.0:20450
Etcd:
  Hosts:
    - etcd:2379
  Key: service.authsession
Log:
  ServiceName: service.authsession
  Mode: file
  Path: /app/logs/authsession
  KeepDays: 7
  Rotation: daily
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20451
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.authsession
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Mysql:
  DSN: teamgram:teamgram@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true
  Active: 64
  Idle: 64
  IdleTimeout: 4h
  
Cache:
  - Host: redis:6379
KV:
  - Host: redis:6379
# Session region: ip2region xdb at /app/data/ip2region for mainland China.
# DB-IP Lite city mmdb at /app/bin/GeoLite2-City.mmdb (MMDB / GEOIP_MMDB)
# for every other address. Either file may be missing. See docs/ip2region.md.
