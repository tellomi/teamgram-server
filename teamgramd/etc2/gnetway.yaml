Name: interface.gateway
ListenOn: 0.0.0.0:20110
Etcd:
  Hosts:
    - etcd:2379
  Key: interface.gateway
Log:
  ServiceName: interface.gateway
  Mode: file
  Path: /app/logs/gnetway
  KeepDays: 7
  Rotation: daily
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20111
  Path: /metrics
#链路追踪
Telemetry:
  Name: interface.gateway
  # Empty unless TELLOMI_OTEL_ENDPOINT is set. No exporter, no export errors.
  Endpoint: ${TELLOMI_OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
  
# Upstream Teamgram default (dev and clients that do not have the rotated key).
# Production prepends TELLOMI_MTPROTO_EXTRA_KEY_* and checks the fingerprint
# at startup. Remove this entry only after those clients are gone.
# See docs/SECURITY-OPS.md.
RSAKey:
  - KeyFile: "./server_pkcs1.key"
    KeyFingerprint: "12240908862933197005"
KeyFile: "./server_pkcs1.key"
KeyFingerprint: "12240908862933197005"
MaxProc: 4

Gnetway:
  Server:
    - Proto: tcp
      Addresses:
        - 0.0.0.0:10443
        - 0.0.0.0:5222
    - Proto: websocket
      Addresses:
        - 0.0.0.0:11443
    # Host nginx stream forwards non-TLS 443 here with PROXY v1.
    # Separate group so 10443 and 5222 stay PPV1 off. Loopback publish only.
    - Proto: tcp
      PPV1: true
      Addresses:
        - 0.0.0.0:10444
    # Private PROXY listener for an L4 relay. Leave it out to stay disabled.
    # When ProxyProtocol is set, TrustedProxyCIDRs is required or the process
    # refuses to start. Bind one private address, never 0.0.0.0. Do not put
    # this on 10443, 5222, 11443, or 10444. Example, not enabled here:
    # - Proto: tcp
    #   ProxyProtocol: v1v2
    #   RequireProxyHeader: true
    #   TrustedProxyCIDRs:
    #     - 172.19.44.222/32
    #   Addresses:
    #     - 10.20.0.218:10445
  Multicore: false
  SendBuf: 65536
  ReceiveBuf: 65536

Session:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session
