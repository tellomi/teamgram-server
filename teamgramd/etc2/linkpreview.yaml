Listen: 0.0.0.0:8801
Log:
  ServiceName: interface.linkpreview
  Mode: file
  Path: /app/logs/linkpreview
  Level: info
  KeepDays: 7
  Rotation: daily
MysqlDSN: teamgram:teamgram@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true
LinkBaseURL: https://tell.cc
PublicURL: ""
PublicMediaBaseURL: ""
Token: ""
MediaKey: ""
RatePerMin: 120
RateBurst: 40
CacheSeconds: 120
TrustProxy: true
MinioEndpoint: minio:9000
MinioAccessKey: minio
MinioSecretKey: miniostorage
MinioSSL: false
# R2 signs as auto. Override the endpoint, keys, SSL, and buckets with
# TELLOMI_MINIO_* (docs/ci-acr.md). Objects are photos|documents|videos/<file_path>
# inside the attachments bucket.
MinioRegion: auto
MinioBucketPhotos: tellomi-attachments
MinioBucketDocuments: tellomi-attachments
MinioBucketVideos: tellomi-attachments
