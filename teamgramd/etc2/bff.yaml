Name: bff.bff
ListenOn: 0.0.0.0:20010
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 0
Log:
  ServiceName: bff.bff
  Mode: file
  Path: /app/logs/bff
  KeepDays: 7
  Rotation: daily
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KV:
  - Host: redis:6379

Code:
  Name: "none"
  SendCodeUrl: ""
  VerifyCodeUrl: ""
  Key: ""
  Secret: ""
  RegionId: ""
  # Dev/test SMS provider. Any phone is accepted with this code.
  # TELLOMI_SMS_PROVIDER=aliyun overrides Name and sends Aliyun SMS. See docs/sms-email.md.
  FixedCode: "12345"

# Dev login numbers, same shape as Telegram test DCs (99966XYYYY).
# X is the datacenter digit; the login code is that digit five times (11111 on DC 1).
# Omit TestPhones to use that built-in range. Set TestPhones: [] to disable it.
# TestPhones:
#   - Prefix: "99966"
#     Length: 10
#     CodeFromDigit: true

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
AuthSessionClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 0
IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 0
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  # One sticker read. Longer than this and the client has already given up.
  Timeout: 3000
StatusClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status
ChannelMySQL: teamgram:teamgram@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true

SyncClient:
  Topic:   "Sync-T"
  Brokers:
    - kafka:9092

Phone:
  PublicIP: 127.0.0.1
  ReflectorPort: 3479
  SFUPort: 3480
  TurnHost: 127.0.0.1
  TurnPort: 3478
  StunPort: 3478
  TurnSecret: tellomi-turn-secret
  TurnTTL: 86400
  RingTimeout: 90
  ConfirmTimeout: 30
  CallLinkPrefix: "https://t.me/call/"
  # Overridden by TELLOMI_RTMP_URL when that variable is set.
  RTMPURL: "rtmp://127.0.0.1:1935/live"
  RTMPKey: tellomi
  EnableP2P: true
