    "/mtproto.RPCUserChannelProfiles": "bff.bff"
    # messages.setShareTheme and messages.getShareThemeBackdrops.
    "/mtproto.RPCShareThemes": "bff.bff"
    # Android messages.getStatsURL. Not in the layer-232 schema.
    "/mtproto.RPCStatsURL": "bff.bff"
    # messages.getFactCheck, messages.editFactCheck, messages.deleteFactCheck.
    "/mtproto.RPCFactChecks": "bff.bff"
    # messages.appendTodoList and messages.toggleTodoCompleted.
    "/mtproto.RPCTodoLists": "bff.bff"
    # messages.toggleSuggestedPostApproval.
    "/mtproto.RPCSuggestedPosts": "bff.bff"
    # messages.composeMessageWithAI. Other aicompose RPCs stay unimplemented.
    "/mtproto.RPCAiComposeTone": "bff.bff"
