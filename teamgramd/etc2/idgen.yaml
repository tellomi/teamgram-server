Name: service.idgen
ListenOn: 0.0.0.0:20660
Etcd:
  Hosts:
    - etcd:2379
  Key: service.idgen
Log:
  ServiceName: service.idgen
  Mode: file
  Path: /app/logs/idgen
  KeepDays: 7
  Rotation: daily
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20661
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.idgen
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
NodeId: 1

# Sequence counters live in Redis. On startup idgen raises any missing or low
# counter to MAX(id) in this database so a flushed Redis cannot issue box ids,
# pts, or seq from 1 again.
Mysql:
  DSN: teamgram:teamgram@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true&loc=Local
  Active: 4
  Idle: 2

SeqIDGen:
  - Host: redis:6379
