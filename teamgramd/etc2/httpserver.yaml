Http:
  Name: interface.httpserver
  Host: 0.0.0.0
  Port: 8801
  Timeout: 0
  MaxBytes: 67108864
  Log:
    ServiceName: interface.httpserver
    Mode: file
    Path: /app/logs/httpserver
    KeepDays: 7
    Rotation: daily
    Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: interface.httpserver
  # Empty unless TELLOMI_OTEL_ENDPOINT is set. No exporter, no export errors.
  Endpoint: ${TELLOMI_OTEL_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
  
KeyFile: "./server_pkcs1.key"
KeyFingerprint: "12240908862933197005"

Session:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session
  Timeout: 0
