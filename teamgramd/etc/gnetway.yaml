Name: interface.gateway
ListenOn: 127.0.0.1:20110
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: interface.gateway
Log:
  ServiceName: interface.gateway
  Mode: file
  Path: ../logs/gnetway
  Level: debug
##监控
#Prometheus:
#  Host: 0.0.0.0
#  Port: 20111
#  Path: /metrics
##链路追踪
#Telemetry:
#  Name: interface.gateway
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger
  
# Upstream Teamgram default. Docker uses teamgramd/etc2/gnetway.yaml.
# See docs/SECURITY-OPS.md.
RSAKey:
  - KeyFile: "./server_pkcs1.key"
    KeyFingerprint: "12240908862933197005"
KeyFile: "./server_pkcs1.key"
KeyFingerprint: "12240908862933197005"
MaxProc: 4

Gnetway:
  Server:
    - Proto: tcp
      Addresses:
        - 0.0.0.0:10443
        - 0.0.0.0:5222
    - Proto: websocket
      Addresses:
        - 0.0.0.0:11443
    # Host nginx stream forwards non-TLS 443 here with PROXY v1.
    # Separate group so 10443 and 5222 stay PPV1 off. Loopback publish only.
    - Proto: tcp
      PPV1: true
      Addresses:
        - 0.0.0.0:10444
    # Private PROXY listener for an L4 relay. Leave it out to stay disabled.
    # When ProxyProtocol is set, TrustedProxyCIDRs is required or the process
    # refuses to start. Bind one private address, never 0.0.0.0. Do not put
    # this on 10443, 5222, 11443, or 10444. Example, not enabled here:
    # - Proto: tcp
    #   ProxyProtocol: v1v2
    #   RequireProxyHeader: true
    #   TrustedProxyCIDRs:
    #     - 172.19.44.222/32
    #   Addresses:
    #     - 10.20.0.218:10445
  Multicore: false
  SendBuf: 65536
  ReceiveBuf: 65536

Session:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.session
