# Second stack on a host that already runs production.
# Compose 2.24 or newer (the !override tag). See docs/staging.md.
#
# Do not run this until docs/ops/STAGING_BRINGUP.md is approved.
# Project name is fixed below. Directory basename and an inherited
# COMPOSE_PROJECT_NAME must not select the production project.
# Use scripts/staging-compose.sh for every lifecycle command.
# Host ports are 127.0.0.1:10444 (TCP) and 127.0.0.1:11444 (WebSocket).

name: tellomi-staging

services:
  kafka:
    container_name: tellomi-staging-kafka
    ports: !override []
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Bind under data-staging so the 8GiB directory cap covers the log.
    # Do not use the production named volume tellomi_kafka_data.
    volumes: !override
      - ./data-staging/kafka:/var/lib/kafka/data

  etcd:
    container_name: tellomi-staging-etcd
    ports: !override []
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes: !override
      - ./data-staging/etcd:/etcd-data

  redis:
    container_name: tellomi-staging-redis
    ports: !override []
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes: !override
      - ./data-staging/redis:/data

  mysql:
    container_name: tellomi-staging-mysql
    ports: !override []
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
    volumes: !override
      - ./data-staging/mysql:/var/lib/mysql
      - ./teamgramd/deploy/sql:/docker-entrypoint-initdb.d/

  mysql-migrate:
    container_name: tellomi-staging-mysql-migrate
    mem_limit: 256m
    memswap_limit: 256m

  minio:
    container_name: tellomi-staging-minio
    ports: !override []
    volumes: !override
      - ./data-staging/minio:/data

  minio-mc:
    container_name: tellomi-staging-minio-mc

  teamgram:
    container_name: tellomi-staging-teamgram
    # Loopback only. Desktop and CI reach these through an SSH local forward
    # or a runner on this host. Do not publish them on 0.0.0.0 from this file.
    # 10444 is host TCP (container MTProto 10443). 11444 is host WebSocket
    # (container 11443). See docs/ops/STAGING_BRINGUP.md.
    ports: !override
      - "127.0.0.1:10444:10443"
      - "127.0.0.1:11444:11443"
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    volumes: !override
      - ./data-staging/logs:/app/logs
      - ${TELLOMI_APNS_KEY_FILE:-/dev/null}:/etc/tellomi/apns/AuthKey.p8:ro
      - ${TELLOMI_FCM_CREDENTIALS_FILE:-/dev/null}:/etc/tellomi/fcm/service-account.json:ro

  # Not needed for desktop chat. Default `up` must not start them.
  asr:
    profiles: ["donotstart"]

  # Host-network and monitoring ports belong to the production stack.
  coturn:
    profiles: ["donotstart"]
  mediamtx:
    profiles: ["donotstart"]
  jaeger:
    profiles: ["donotstart"]
  node-exporter:
    profiles: ["donotstart"]
  prometheus:
    profiles: ["donotstart"]
  grafana:
    profiles: ["donotstart"]
  elasticsearch:
    profiles: ["donotstart"]
  kibana:
    profiles: ["donotstart"]
  filebeat:
    profiles: ["donotstart"]
  go-stash:
    profiles: ["donotstart"]

networks:
  teamgram_net:
    name: tellomi_staging_net
    ipam:
      config: !override
        - subnet: 172.21.0.0/16
