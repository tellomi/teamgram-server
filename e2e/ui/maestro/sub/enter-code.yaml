appId: app.tellomi.chat
---
- extendedWaitUntil:
    visible: "Enter code|输入验证码|Phone verification|电话验证|验证码"
    timeout: 90000
- tapOn:
    id: "Auth.CodeEntry.CodeField"
    optional: true
- tapOn:
    text: "Enter code|输入验证码|验证码"
    optional: true
- inputText: ${CODE}
- takeScreenshot: code-entered
