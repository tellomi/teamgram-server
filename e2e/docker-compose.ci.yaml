# GitHub-hosted runners cannot pull minio/minio or minio/mc (Docker Hub
# 401, dl.min.io 410). This overlay keeps the service name `minio` and the
# MINIO_ROOT_* credentials the app already uses, and runs RustFS, which
# speaks the same S3 API and accepts those variables. Bucket setup uses the
# AWS CLI because mc is not pullable. Monitoring, coturn, and MediaMTX are
# left out so the job only needs MySQL, Redis, Kafka, etcd, and object storage.
#
# Production compose files are unchanged. Chengdu still pulls the image in
# docker-compose-env.yaml.

services:
  minio:
    # docker-compose-env.yaml puts minio on profile local-minio, so a plain
    # `up` never starts it and dfs exits on the bucket check: every upload
    # in e2e failed with "produced zero addresses". CI always needs it.
    profiles: !reset []
    image: rustfs/rustfs:latest
    # The image user cannot write a root-owned bind mount. Root matches the
    # MinIO image this service replaces.
    user: "0:0"
    # :9000 binds IPv6-only in this image, so other containers cannot connect.
    command: ["server", "/data", "--address", "0.0.0.0:9000", "--console-address", "0.0.0.0:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniostorage}
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniostorage}
      RUSTFS_ADDRESS: 0.0.0.0:9000

  minio-mc:
    profiles: !reset []
    image: amazon/aws-cli:2.22.35
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 30); do
          aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1 && break
          sleep 2
        done
        aws --endpoint-url http://minio:9000 s3 mb s3://tellomi-attachments || true
        aws --endpoint-url http://minio:9000 s3 mb s3://tellomi-public-media || true
        aws --endpoint-url http://minio:9000 s3 mb s3://tellomi-backups || true
        aws --endpoint-url http://minio:9000 s3 mb s3://photos || true
        aws --endpoint-url http://minio:9000 s3 mb s3://documents || true
        aws --endpoint-url http://minio:9000 s3 mb s3://videos || true
        aws --endpoint-url http://minio:9000 s3 ls
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniostorage}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

  # The SenseVoice image downloads the model at build time. CI does not
  # start it. The trial quota stays 0 so clients hide the button.
  asr:
    profiles: ["donotstart"]
  # Local stand-in for Bailian. It is not DashScope. No host port is
  # published; only the teamgram container can call it on the compose network.
  fakebailian:
    image: python:3.12-alpine
    volumes:
      - ./e2e/fakebailian/server.py:/server.py:ro
    command: ["python", "-u", "/server.py"]
    environment:
      FAKE_BAILIAN_KEY: e2e-fake-not-production
      PORT: "18099"
    networks:
      - teamgram_net
  teamgram:
    environment:
      TELLOMI_TRANSCRIBE_ENABLED: "false"
      # Profile and channel-title checks in e2e/client/profile_name_test.go.
      # Production stays off until TELLOMI_USERNAME_POLICY=1 is set there.
      TELLOMI_USERNAME_POLICY: "1"
      # Do not call www.tellomi.cn from CI. Production leaves this empty so
      # latest.json drives help.getAppUpdate.
      TELLOMI_APP_UPDATE_MANIFEST: "off"
      # Isolated enforcement for TestAccountEnforcementBanAndLift. These are
      # not production switches. The database is tellomi_enforcement_e2e,
      # created by e2e/enforcementmigrate before this service starts.
      # TELLOMI_AI points at fakebailian, not DashScope.
      TELLOMI_ENFORCEMENT_STORE: mysql
      TELLOMI_ENFORCEMENT_MYSQL: root:root@tcp(mysql:3306)/tellomi_enforcement_e2e?parseTime=true&charset=utf8mb4
      TELLOMI_ENFORCEMENT_CREATE: "1"
      TELLOMI_ENFORCEMENT_REVIEW: "1"
      TELLOMI_ENFORCEMENT_ADMINS: erel
      TELLOMI_ENFORCEMENT_CONFIDENCE: "0.8"
      TELLOMI_ENFORCEMENT_ADDR: 0.0.0.0:8820
      TELLOMI_ENFORCEMENT_E2E: ${TELLOMI_ENFORCEMENT_E2E:-}
      TELLOMI_ENFORCEMENT_SERVICE_KEY: ${TELLOMI_ENFORCEMENT_SERVICE_KEY:-}
      TELLOMI_AI: "1"
      TELLOMI_AI_API_KEY: e2e-fake-not-production
      TELLOMI_AI_BASE_URL: http://fakebailian:18099
      TELLOMI_AI_MODEL_PRIMARY: e2e-fake-bailian
      TELLOMI_AI_ADDR: "off"
      # CI users are not the production allowlist. * keeps the fake model reachable.
      TELLOMI_AI_ALLOW_USERNAMES: "*"
      TELLOMI_REPORT_REVIEW: "0"
      # Crash-report query listener. The token is a CI fixture, not a production secret.
      # It is only reachable on 127.0.0.1 inside this container.
      # Pinned to 8818. The default is 127.0.0.1:8819, which this job's
      # TELLOMI_ENFORCEMENT_E2E=1 drill already binds. The client dials 8818.
      TELLOMI_CRASH_REPORT_TOKEN: e2e-crash-report-not-production
      TELLOMI_CRASH_REPORT_ADDR: 127.0.0.1:8818
    # dfs checks the attachments bucket once at startup.
    depends_on:
      minio-mc:
        condition: service_completed_successfully
      fakebailian:
        condition: service_started
  coturn:
    profiles: ["donotstart"]
  mediamtx:
    profiles: ["donotstart"]
  jaeger:
    profiles: ["donotstart"]
  node-exporter:
    profiles: ["donotstart"]
  prometheus:
    profiles: ["donotstart"]
  grafana:
    profiles: ["donotstart"]
  elasticsearch:
    profiles: ["donotstart"]
  kibana:
    profiles: ["donotstart"]
  filebeat:
    profiles: ["donotstart"]
  go-stash:
    profiles: ["donotstart"]
