# Chengdu production stream snippet.
# Install as /etc/nginx/stream.d/tellomi-sni.conf. The host nginx.conf already
# contains: stream { include /etc/nginx/stream.d/*.conf; }
# This file is not a complete nginx.conf. See docs/ops/mtproto-443.md.
#
# Non-TLS clients, including one that dials the raw IP and sends no SNI,
# are selected only by an empty $ssl_preread_protocol. TLS keeps the
# existing SNI map. Do not route MTProto by server name.

map $ssl_preread_server_name $tellomi_upstream {
    grpc.chat.tellomi.cn 127.0.0.1:8443;
    default              127.0.0.1:4443;
}

map $ssl_preread_protocol $tellomi_entry_upstream {
    ""      127.0.0.1:10444;
    default $tellomi_upstream;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    # A finished ClientHello is classified as soon as its record is in
    # hand. An obfuscated init whose first bytes look like a TLS record
    # (0x16 0x03) makes ssl_preread wait for the rest of that record.
    # nginx 1.24 closes the client on preread_timeout. It does not proxy
    # those bytes. 5s bounds that wait. See docs/ops/mtproto-443.md.
    preread_timeout 5s;
    proxy_protocol on;
    proxy_pass $tellomi_entry_upstream;
}
