# Pinned inputs for the cn politics word lists.
# pkg/usernamepolicy/lexiconsrc/update.py reads this file.
# Runtime loads policy/policy-2026110602.json plus the promoted lines from
# the vendored konsheng files. It does not read this toml and it does not
# read Vocabulary/零时-Tencent.txt.
#
# Refresh:
#   python3 -m pip install 'pypinyin==0.55.0'
#   python3 pkg/usernamepolicy/lexiconsrc/update.py --fetch
# --fetch re-downloads every pinned blob, refuses a mismatch, and rewrites
# the D-25 generated files. It does not edit policy-2026110602.json.
# --emit-runtime rewrites generated/runtime-pinyin.tsv from the promoted
# MIT lines plus editorial/gfw-allow.tsv. --check-runtime fails when that
# file drifts. --fetch also checks the GFW blob and that every allowlist
# line is an exact line of that blob. The GFW file is not vendored.
#
# Offline check (no download; still needs pypinyin==0.55.0):
#   python3 pkg/usernamepolicy/lexiconsrc/update.py --check
#
# Words that are not in the three konsheng category files below are not
# invented here. Vocabulary/零时-Tencent.txt is an overlap exclusion only.
# Its bytes are not stored in this repository.

